<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- <link rel="icon" href="/favicon.ico" /> -->
  <link rel="icon" href="/Logo-IAST.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Tokisaki Nino</title>
  <link rel="stylesheet" type="text/css" href="/loader.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 14px;
    }

    /* Hiệu ứng loading mới */
    #loading-bg {
      position: fixed;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--initial-loader-bg, #FFFFFF);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      transition: opacity 0.5s ease-out;
    }

    .loading-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-container {
      text-align: center;
    }

    .edu-ai-loader {
      width: 80px;
      height: 80px;
      position: relative;
      margin-bottom: 20px;
    }

    .edu-ai-loader:before,
    .edu-ai-loader:after {
      content: '';
      position: absolute;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: var(--initial-loader-color, #696CFF);
      animation: spin 1.5s linear infinite;
    }

    .edu-ai-loader:before {
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .edu-ai-loader:after {
      top: 8px;
      left: 8px;
      right: 8px;
      bottom: 8px;
      border-top-color: var(--initial-loader-color, #696CFF);
      opacity: 0.7;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      color: var(--initial-loader-color, #696CFF);
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-top: 15px;
    }

    .loader-brand {
      margin-bottom: 30px;
      font-size: 24px;
      font-weight: bold;
      color: var(--initial-loader-color, #696CFF);
    }

    .loading-gif {
      width: 180px;
      height: auto;
      display: block;
      margin: 20px auto 0;
      image-rendering: auto;
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- Nội dung ứng dụng sẽ được render ở đây -->
  </div>

  <div id="loading-bg">
    <div class="loader-container">
      <div class="loader-brand">💖 Tokisaki Nino 🌟</div>
      <img
        src="/images/shigure-ui-smol.gif"
        alt="Loading..."
        class="loading-gif"
      />
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // Thiết lập màu sắc từ localStorage
    const loaderColor = localStorage.getItem('sneat-initial-loader-bg') || '#FFFFFF'
    const primaryColor = localStorage.getItem('sneat-initial-loader-color') || '#696CFF'

    if (loaderColor)
      document.documentElement.style.setProperty('--initial-loader-bg', loaderColor)

    if (primaryColor)
      document.documentElement.style.setProperty('--initial-loader-color', primaryColor)

    // Ẩn loading khi trang đã tải xong
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loadingBg = document.getElementById('loading-bg');
        loadingBg.classList.add('loading-hidden');

        setTimeout(() => {
          loadingBg.style.display = 'none';
        }, 500);
      }, 500);
    });

    // Fallback: Ẩn loading sau 5 giây dù trang có tải xong hay không
    setTimeout(() => {
      const loadingBg = document.getElementById('loading-bg');
      if (loadingBg.style.display !== 'none') {
        loadingBg.classList.add('loading-hidden');

        setTimeout(() => {
          loadingBg.style.display = 'none';
        }, 500);
      }
    }, 5000);
  </script>
</body>

</html>
